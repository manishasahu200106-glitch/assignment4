# Render Blueprint Specification (render.yaml)
# https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Node.js API)
  # ---------------------------------------------------------------------------
  - type: web
    name: mern-blog-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set via Render Dashboard (e.g. MongoDB Atlas connection string)
      - key: CORS_ORIGIN
        sync: false # Set to your deployed frontend URL (e.g. https://mern-blog-frontend.onrender.com)

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React Single Page App)
  # ---------------------------------------------------------------------------
  - type: web
    name: mern-blog-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your deployed backend URL + /api (e.g. https://mern-blog-backend.onrender.com/api)
