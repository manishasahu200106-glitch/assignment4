# Render Blueprint Specification (render.yaml)
# https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Unified Production Web Service (Node.js API + Static React Frontend)
  # ---------------------------------------------------------------------------
  - type: web
    name: mern-blog-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set in Render Dashboard: your MongoDB Atlas connection string
      - key: CORS_ORIGIN
        value: "*"
